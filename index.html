<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tribunal das Reuniões</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <h1>⚖️ Tribunal das Reuniões</h1>
      <p>Transforme uma reunião em um veredicto satírico.</p>
    </section>

    <section class="card form-card">
      <form id="meeting-form">
        <!-- Título da reunião -->
        <div class="field-group">
          <label for="meeting-title">Título da reunião</label>
          <input id="meeting-title" name="meetingTitle" type="text" maxlength="120" placeholder="Ex: Weekly Sync com o time" />
        </div>

        <!-- Duração -->
        <div class="field-group">
          <label>Duração</label>
          <div class="button-group">
            <button type="button" class="duration-btn" data-value="15">15 min</button>
            <button type="button" class="duration-btn" data-value="30">30 min</button>
            <button type="button" class="duration-btn" data-value="45">45 min</button>
            <button type="button" class="duration-btn" data-value="60">60 min</button>
            <button type="button" class="duration-btn" data-value="90">90 min+</button>
          </div>
          <input id="duration-value" name="durationMinutes" type="hidden" value="30" />
        </div>

        <!-- Tipo de reunião -->
        <div class="field-group">
          <label>Tipo de reunião</label>
          <div class="button-group">
            <button type="button" class="meeting-type-btn" data-type="Update">Update</button>
            <button type="button" class="meeting-type-btn" data-type="Decisão">Decisão</button>
            <button type="button" class="meeting-type-btn" data-type="Brainstorm">Brainstorm</button>
            <button type="button" class="meeting-type-btn" data-type="Apresentação">Apresentação</button>
            <button type="button" class="meeting-type-btn" data-type="Alinhamento">Alinhamento</button>
          </div>
          <input id="meeting-type-value" name="meetingType" type="hidden" value="Update" />
        </div>

        <!-- Características -->
        <div class="field-group">
          <label>Características</label>
          <div class="chips-group">
            <button type="button" class="chip" data-trait="buzzwords">
              Teve buzzwords
            </button>
            <button type="button" class="chip" data-trait="followups">
              Teve follow-ups
            </button>
            <button type="button" class="chip" data-trait="email">
              Era um email
            </button>
            <button type="button" class="chip" data-trait="circleback">
              Teve circle back
            </button>
            <button type="button" class="chip" data-trait="slides">
              Teve slides
            </button>
            <button type="button" class="chip" data-trait="boss">
              Boss foi mencionado
            </button>
          </div>
          <input id="traits-value" name="traits" type="hidden" value="" />
        </div>

        <button type="submit" class="primary-button">⚖️ Julgar esta reunião</button>
      </form>
    </section>

    <section class="card result-card hidden" id="result-card">
      <div class="result-header">
        <div>
          <h2 class="result-title">⚖️ Tribunal das Reuniões</h2>
          <span class="case-number" id="case-number">Caso #000</span>
        </div>
        <span class="badge" id="result-badge">Badge</span>
      </div>

      <div class="crime-verdict-container">
        <div class="crime-section">
          <p class="section-label">Crime</p>
          <h3 id="result-crime">Crime</h3>
        </div>
        <div class="verdict-section">
          <p class="section-label">Veredito</p>
          <p class="verdict-text" id="result-verdict">Veredito</p>
        </div>
      </div>

      <div class="sentence-section">
        <p class="section-label">Sentença</p>
        <p class="sentence-text" id="result-sentence">Sentença</p>
      </div>

      <div class="metrics-grid">
        <div class="metric-item">
          <span class="metric-label">Instagram %</span>
          <span class="metric-value" id="metric-instagram">0%</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Email %</span>
          <span class="metric-value" id="metric-email">0%</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Buzzword %</span>
          <span class="metric-value" id="metric-buzzword">0%</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Sofrimento %</span>
          <span class="metric-value" id="metric-suffering">0%</span>
        </div>
      </div>

      <div class="narrative-block">
        <p class="narrative-line" id="narrative-accusation"></p>
        <p class="narrative-line" id="narrative-evidence"></p>
        <p class="narrative-line narrative-punchline" id="narrative-punchline"></p>
      </div>

      <div class="result-actions">
        <button type="button" class="secondary-button" id="copy-button">📋 Copiar veredicto</button>
        <button type="button" class="secondary-button" id="reset-button">🔄 Julgar outra reunião</button>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
